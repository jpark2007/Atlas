name: Atlas
options:
  bundleIdPrefix: com.atlaslm
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AtlasCore:
    path: AtlasCore
  # Sparkle 2 — auto-updates for the direct-download DMG channel only.
  # macOS-only by design: it is wired into the Atlas target and MUST NOT be added
  # to AtlasMobile / AtlasMobileWidgets / AtlasCore (AtlasCore is shared with iOS).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
# Project-wide per-developer settings (DEVELOPMENT_TEAM) live in the gitignored
# Config/Secrets.xcconfig — never hardcode a team id here; each dev builds with
# their own team. See Config/Secrets.example.xcconfig.
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.10.1"
    CURRENT_PROJECT_VERSION: "4"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Atlas:
    type: application
    platform: macOS
    # Google OAuth client id/secret come from Config/Secrets.xcconfig (gitignored).
    # Missing file → Xcode treats the base config as empty (warning, not error).
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: Atlas
        excludes:
          - "Atlas.entitlements"
          - "Atlas-DeveloperID.entitlements"
      - path: Atlas/Atlas.entitlements
        buildPhase: none
      - path: Atlas/Atlas-DeveloperID.entitlements
        buildPhase: none
    dependencies:
      - package: AtlasCore
      # Embedded + signed into Atlas.app; carries Sparkle's own Updater.app and
      # Autoupdate helper, which the hardened runtime signs along with the framework.
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlaslm.Atlas
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Atlas/Atlas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Custom Info.plist keys (GoogleOAuthClientID/Secret) are NOT emitted by Xcode's
        # INFOPLIST_KEY_* mechanism — that only handles Apple's known keys. So we generate
        # the plist explicitly below; $(...) values still resolve from Secrets.xcconfig.
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Direct-download beta ships a Developer ID signed + notarized build.
        # Debug keeps Automatic signing (and CODE_SIGNING_ALLOWED=NO still works);
        # only Release switches to the manual Developer ID identity.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 2WA54D67Y8
          # Developer ID cannot carry Sign In with Apple, so Release signs against the
          # SIWA-free entitlements file. With no applesignin entitlement, Developer ID
          # needs NO provisioning profile.
          CODE_SIGN_ENTITLEMENTS: Atlas/Atlas-DeveloperID.entitlements
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: Atlas/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Sparkle compares the appcast's <sparkle:version> against THIS key. The
        # project-wide CURRENT_PROJECT_VERSION tracks the iOS build number, so
        # leaving it here would make every release look identical to the updater and
        # no update would ever be offered. The Mac app therefore versions its bundle
        # by the marketing version. (AtlasMobile keeps CURRENT_PROJECT_VERSION — the
        # App Store wants a monotonic integer build number there.)
        CFBundleVersion: "$(MARKETING_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: "public.app-category.productivity"
        NSHumanReadableCopyright: "© 2026 Atlas"
        NSCalendarsUsageDescription: "Atlas reads your Apple Calendar events to display them alongside your Atlas schedule. No events are modified."
        NSCalendarsFullAccessUsageDescription: "Atlas reads your Apple Calendar events to show them alongside your schedule. Atlas never modifies your calendars."
        NSMicrophoneUsageDescription: "Atlas uses the microphone for click-to-talk capture, transcribing what you say into the capture bar. Recording only starts when you tap the mic."
        NSSpeechRecognitionUsageDescription: "Atlas transcribes your speech on-device so you can dictate tasks and notes into the capture bar."
        GoogleOAuthClientID: "$(GOOGLE_OAUTH_CLIENT_ID)"
        GoogleOAuthClientSecret: "$(GOOGLE_OAUTH_CLIENT_SECRET)"
        DriveOnePickRedirectURI: "$(DRIVE_ONEPICK_REDIRECT_URI)"
        # ── Sparkle 2 (direct-download DMG auto-updates) ─────────────────────
        # The app is NOT sandboxed (see Atlas.entitlements), so Sparkle needs no
        # XPC installer-service keys — the standard, non-sandboxed setup applies.
        SUFeedURL: "https://www.atlaslm.net/appcast.xml"
        # REPLACE ME. Drew runs Sparkle's `generate_keys` ONCE: it stores the private
        # key in his login keychain and prints the public key — paste that value here.
        # Until then the app cannot verify any update (Sparkle refuses to install), and
        # scripts/release-dmg.sh refuses to build a release. See UpdaterService.swift.
        SUPublicEDKey: "0z9ZVqbz7/IwSwmjyP6YLz6wBk9mmQr41ZV/yzBsBPI="
        SUEnableAutomaticChecks: true
        # Registers atlas:// so the Supabase OAuth callback (atlas://auth-callback)
        # opened in the system default browser routes back into the app via
        # .onOpenURL — Xcode's INFOPLIST_KEY_* mechanism can't emit CFBundleURLTypes.
        CFBundleURLTypes:
          - CFBundleURLName: com.atlaslm.Atlas
            CFBundleURLSchemes:
              - atlas
        # "Open with Atlas" for a downloaded .ics — most registrars hand students a
        # FILE ("export course schedule"), not a subscribable link. Viewer/Alternate:
        # Atlas reads the file once into the class importer and never claims to own it,
        # so Calendar.app stays the default handler.
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Calendar file"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.ical.ics
  AtlasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AtlasTests
    dependencies:
      - target: Atlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Phase-0 iOS companion skeleton: bare sign-in on the shared AtlasCore package.
  AtlasMobile:
    type: application
    platform: iOS
    sources:
      - path: AtlasMobile
        excludes:
          - "AtlasMobile.entitlements"
      - path: AtlasMobile/AtlasMobile.entitlements
        buildPhase: none
      # Shared app↔widget contract — compiled into both targets.
      - path: AtlasMobileWidgets/SharedSnapshot.swift
    dependencies:
      - package: AtlasCore
      - target: AtlasMobileWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlaslm.AtlasMobile
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AtlasMobile/AtlasMobile.entitlements
        # iPhone only for 1.0 — the layouts are phone-shaped, and shipping iPad would
        # put a stretched phone UI in front of App Review. iPad still runs it in
        # compatibility mode. The App Store version is iOS-local: the Mac ships on its
        # own channel (DMG + Sparkle) and stays on its own MARKETING_VERSION.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Explicit Info.plist (below) so we can register the atlas:// URL scheme —
        # Xcode's INFOPLIST_KEY_* mechanism can't emit CFBundleURLTypes.
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: AtlasMobile/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Atlas
        CFBundleName: Atlas
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Atlas uses the microphone for click-to-talk capture, transcribing what you say into the capture bar. Recording only starts when you tap the mic."
        NSSpeechRecognitionUsageDescription: "Atlas transcribes your speech on-device so you can dictate tasks and notes into the capture bar."
        NSCalendarsFullAccessUsageDescription: "Atlas reads your Apple Calendar events to show them alongside your schedule. Atlas never modifies your calendars from your phone."
        CFBundleURLTypes:
          - CFBundleURLName: com.atlaslm.AtlasMobile
            CFBundleURLSchemes:
              - atlas
  # WidgetKit extension: home + lock widgets + iOS-18 capture control. Kept
  # dependency-free (no AtlasCore) — the app-group JSON (SharedSnapshot) is the
  # whole contract. Shares the app group with AtlasMobile.
  AtlasMobileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AtlasMobileWidgets
        excludes:
          - "AtlasMobileWidgets.entitlements"
      - path: AtlasMobileWidgets/AtlasMobileWidgets.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlaslm.AtlasMobile.widgets
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AtlasMobileWidgets/AtlasMobileWidgets.entitlements
        # Matches the app it embeds in — both must agree or the archive is rejected.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: AtlasMobileWidgets/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Atlas:
    build:
      targets:
        Atlas: all
        AtlasTests: [test]
    test:
      targets:
        - AtlasTests
  AtlasMobile:
    build:
      targets:
        AtlasMobile: all
